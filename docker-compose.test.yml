version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 前端开发服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5176:5176"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  # 测试服务
  test:
    image: node:20-alpine
    working_dir: /app
    environment:
      - API_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:5176
    volumes:
      - ./:/app
    command: |
      sh -c "
        echo '等待服务启动...' &&
        sleep 5 &&
        echo '运行 API 测试...' &&
        node test/api.test.js
      "
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  node_modules:
    driver: local
