version: '3.8'

services:
  # 生产环境：后端 + 前端静态文件
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-manager
    # ✅ 使用 host 网络模式，让容器共享宿主网络命名空间
    network_mode: host
    environment:
      - DATABASE_PATH=/app/data/sqlite.db
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # 持久化数据库
      - sms_data:/app/data

volumes:
  sms_data:
